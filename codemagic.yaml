workflows:
  ios-testflight:
    name: iOS TestFlight Release
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: ChiraagEAzaa
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mirali.chiraageazaa
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APPLE_ID: 6786198976
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Prepare Flutter iOS configuration
        script: |
          flutter pub get
          flutter build ios --config-only --release --no-codesign
          test -f ios/Flutter/Generated.xcconfig
      - name: Install pods
        script: |
          cd ios && pod install
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Flutter build ipa
        script: |
          echo "Querying App Store Connect for latest build number under Apple ID: $APP_STORE_APPLE_ID"
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>&1 || true)
          echo "App Store Connect response: $LATEST_BUILD"
          if ! [[ "$LATEST_BUILD" =~ ^[0-9]+$ ]] || [ "$LATEST_BUILD" -lt 6 ]; then
            echo "Latest build is empty, non-numeric, or < 6. Setting base to 6 (Apple reviewed build 6)."
            LATEST_BUILD=6
          fi
          BUILD_NUMBER=$((LATEST_BUILD + 1))
          echo "Building iOS IPA with build number: $BUILD_NUMBER"
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false